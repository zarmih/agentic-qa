name: Release validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  package-matrix:
    name: Node 24 / ${{ matrix.os }} / package + Chromium
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npx vitest run tests/unit

      - name: Audit package contents
        run: npm pack --dry-run

      - name: Install Chromium with Linux dependencies
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium
        if: runner.os != 'Linux'
        run: npx playwright install chromium

      - name: Clean package installation and browser smoke
        run: npm run release:package-smoke
